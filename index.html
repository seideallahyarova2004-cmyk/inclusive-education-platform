<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rəqəmsal Məktəb</title>
<style>
:root {
  --hero-bg: #4c0e91;
  --purple: #2b56f5;
  --pink: #ee4db8;
  --lime: #b7f15c;
  --dark-purple: #3f097a;
  --ink: #171717;
  --card-blue: #2563eb;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
a{color:inherit;text-decoration:none}

/* Navigation Header */
.hero{min-height:600px;position:relative;overflow:hidden;color:#fff;background:var(--hero-bg);border-radius:0 0 32px 32px}
.nav{position:relative;z-index:2;max-width:1150px;margin:auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
.brand-mark{font-size:24px;line-height:1;color:var(--lime)}
.nav-links{display:flex;align-items:center;gap:22px;font-size:11px;font-weight:600}
.nav-links a:hover{opacity:.8}
.login{background:var(--lime);color:#17200c;padding:9px 20px;border-radius:30px;font-size:11px;font-weight:700}

/* Hero Content & People Portraits */
.hero-content{position:relative;z-index:1;text-align:center;padding:10px 18px 36px}
h1{font-size:36px;line-height:1.2;margin:12px 0 10px;font-weight:800;letter-spacing:-.8px}
.subtitle{font-size:12px;margin:0 0 30px;opacity:.9}

.people{max-width:840px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:16px}
.person{width:180px;display:flex;flex-direction:column;align-items:center;position:relative}

.portrait{width:100%;height:260px;overflow:hidden;position:relative;border-radius:100px;display:flex;align-items:center;justify-content:center}
.person:nth-child(1) .portrait{background:var(--purple)}
.person:nth-child(2) .portrait{background:var(--pink)}
.person:nth-child(3) .portrait{background:var(--dark-purple)}
.person:nth-child(4) .portrait{background:var(--lime)}

.portrait img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.person-button{margin-top:14px;min-width:105px;padding:9px 20px;border:1px solid rgba(255,255,255,0.8);border-radius:30px;color:#fff;font-size:12px;font-weight:600;background:transparent;cursor:pointer;text-align:center;transition:all 0.2s}
.person-button:hover{background:#fff;color:var(--hero-bg)}
.spark{position:absolute;z-index:2;color:var(--lime);font-size:26px;left:4px;top:-8px}

/* Main Cards Grid */
.content{max-width:980px;margin:0 auto;padding:44px 20px 40px}
.role-section{padding:0 0 40px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}
.section-head h2{font-size:24px;margin:0;font-weight:700;letter-spacing:-.5px}
.continue{background:#111625;color:#fff;border:0;border-radius:28px;padding:12px 24px;font-size:12px;font-weight:700;cursor:pointer}

.grid-cards{display:grid;grid-template-columns:1.25fr 0.85fr;gap:18px;align-items:stretch}
.left-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.info-card{border-radius:20px;padding:20px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start}
.info-card h3{font-size:14px;line-height:1.35;margin:0 0 8px;font-weight:700}
.info-card p{font-size:11px;line-height:1.45;margin:0;opacity:.9}

.card-blue{background:var(--card-blue);color:#fff}
.card-lime{background:var(--lime);color:#17200c}
.card-dark{background:var(--dark-purple);color:#fff;grid-column:1;grid-row:2}
.card-pink{background:var(--pink);color:#fff;grid-column:2;grid-row:2;position:relative}

.card-dark .darslik-badge{margin-top:14px;background:#fff;color:#2563eb;padding:6px 12px;border-radius:12px;font-weight:800;font-size:11px;width:fit-content;display:flex;align-items:center;gap:6px}
.card-pink::after{content:"?";position:absolute;right:10px;bottom:-10px;font-size:85px;font-weight:900;color:rgba(255,255,255,0.22);pointer-events:none}

.card-photo{border-radius:20px;overflow:hidden;position:relative;min-height:340px}
.card-photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}

.avatar-group{display:flex;align-items:center;margin-top:14px}
.avatar-group img{width:26px;height:26px;border-radius:50%;border:2px solid var(--lime);margin-left:-6px}
.avatar-group img:first-child{margin-left:0}

.footer{text-align:center;color:#888;font-size:11px;padding:24px}

@media(max-width:850px){
  .grid-cards{grid-template-columns:1fr}
  .left-grid{grid-template-columns:1fr 1fr}
  .people{flex-wrap:wrap;gap:12px}
  .person{width:45%}
}
</style>
</head>
<body>

<header class="hero" id="top">
  <nav class="nav">
    <a class="brand" href="#top"><span class="brand-mark">✦</span><span>r
