<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rəqəmsal Məktəb — Rəqəmsal məktəb platforması</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#164e63',
          'primary-foreground': '#ffffff',
          secondary: '#0d9488',
          'secondary-foreground': '#ffffff',
          accent: '#f59e0b',
          'accent-foreground': '#ffffff',
          pink: '#f43f5e',
          card: '#ffffff',
          muted: '#f1f5f9',
          'muted-foreground': '#64748b',
          foreground: '#0f172a'
        }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
</style>
</head>
<body class="bg-background text-foreground antialiased">

  <!-- ================= 1. ANA SƏHİFƏ (LANDING PAGE) ================= -->
  <main id="landing-page" class="font-sans">
    <section class="relative overflow-hidden bg-primary pb-20 text-primary-foreground">
      <div class="pointer-events-none absolute -right-24 -top-24 h-96 w-96 rounded-full bg-secondary opacity-60 blur-3xl"></div>
      <div class="pointer-events-none absolute -bottom-32 -left-24 h-96 w-96 rounded-full bg-pink opacity-30 blur-3xl"></div>
      
      <!-- Header / Naviqasiya -->
      <header class="mx-auto max-w-7xl px-4 md:px-8 relative flex items-center justify-between py-6">
        <a href="#" class="flex items-center gap-2 text-xl font-extrabold text-primary-foreground">
          <span class="grid h-10 w-10 place-items-center rounded-xl bg-accent text-accent-foreground">R</span>
          Rəqəmsal Məktəb
        </a>
        <nav class="hidden items-center gap-6 text-sm font-semibold lg:flex">
          <a href="#about" class="hover:text-accent">Layihə haqqında</a>
          <a href="#teaching-videos" class="hover:text-accent">Tədris videoları</a>
          <a href="#mapsBanner" class="hover:text-accent">Bakı şəhəri üzrə məktəblər</a>
          <a href="#faq" class="hover:text-accent">FAQ</a>
          <a href="#" class="hover:text-accent">İstifadəçi təlimatı</a>
          <button onclick="openPanel('student-panel')" class="rounded-full bg-accent px-6 py-2.5 font-bold text-accent-foreground">Giriş</button>
        </nav>
      </header>

      <!-- Hero & Rollar -->
      <div class="mx-auto max-w-7xl px-4 md:px-8 relative pt-10 text-center">
        <h1 class="text-4xl font-extrabold md:text-6xl">Rəqəmsal məktəb platforması</h1>
        <p class="mx-auto mt-4 max-w-xl text-lg opacity-80">Rəqəmsal mühitdə öyrənmə, tədris, ünsiyyət və əməkdaşlıq platformasıdır.</p>
        
        <!-- Rolların Kartları (5 Role: Şagird, Valideyn, Müəllim, Mütəxəssis, Direktor) -->
        <div class="mt-14 grid grid-cols-2 gap-4 md:grid-cols-5">
          <!-- Şagird -->
          <div onclick="openPanel('student-panel')" class="cursor-pointer relative flex flex-col items-center transition transform hover:-translate-y-1">
            <div class="relative h-56 w-full overflow-hidden rounded-[2rem] md:h-72 bg-accent flex items-end justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-36 w-36 text-white mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
            </div>
            <span class="-mt-5 relative rounded-full bg-card px-5 py-2 text-sm font-bold text-foreground shadow-lg">Şagird</span>
          </div>
          <!-- Valideyn -->
          <div class="relative flex flex-col items-center md:mt-8">
            <div class="relative h-56 w-full overflow-hidden rounded-[2rem] md:h-72 bg-pink flex items-end justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-36 w-36 text-white mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            </div>
            <span class="-mt-5 relative rounded-full bg-card px-5 py-2 text-sm font-bold text-foreground shadow-lg">Valideyn</span>
          </div>
          <!-- Müəllim -->
          <div class="relative flex flex-col items-center md:mt-8">
            <div class="relative h-56 w-full overflow-hidden rounded-[2rem] md:h-72 bg-secondary flex items-end justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-36 w-36 text-white mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            </div>
            <span class="-mt-5 relative rounded-full bg-card px-5 py-2 text-sm font-bold text-foreground shadow-lg">Müəllim</span>
          </div>
          <!-- Mütəxəssis (Əlavə olunmuş yeni rol) -->
          <div onclick="openPanel('specialist-panel')" class="cursor-pointer relative flex flex-col items-center md:mt-8 transition transform hover:-translate-y-1">
            <div
